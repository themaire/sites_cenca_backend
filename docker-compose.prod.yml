# docker-compose.prod.yml
# Conservé pour compatibilité (start.sh, habitudes) :
#   docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# La configuration de production est désormais entièrement dans docker-compose.yml :
# ce fichier ne fait que la réaffirmer.

services:
  node_app:
    environment:
      - NODE_ENV=production
