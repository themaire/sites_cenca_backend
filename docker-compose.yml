
# Configuration de PRODUCTION complète : un simple « docker-compose up -d » lance la prod (HTTPS).
# Le développement se fait hors Docker : ./start.sh dev (npm start, port 8887).
# Ne pas créer de docker-compose.override.yml : docker-compose le chargerait d'office.

services:
  node_app:
    build: .
    # image: node_pgsql-node_app:latest
    user: "0:0"  # root pour lire les certificats SSL montés en lecture seule
    environment:
      - NODE_ENV=production  # absent du .env : sans lui le code démarre en HTTP (development)
      # Prod sur le serveur Ollama principal ; le dev (npm start, .env) utilise un autre serveur (Raspberry Pi) :
      # deux backends sur le même Ollama se ralentissent et se vident le cache du prompt l'un l'autre
      - OLLAMA_URL=http://192.168.1.26:11434
      - OLLAMA_MODEL=gemma4:26b
    volumes:
      - /etc/letsencrypt/live/si-10.cen-champagne-ardenne.org:/etc/letsencrypt/live/si-10.cen-champagne-ardenne.org:ro
      - /mnt/storage_data/app/:/mnt/storage_data/app/
    ports:
      - "8889:8887"
    networks:
      - monitoring
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - monitoring
    restart: unless-stopped

  # Service de surveillance automatique CENCA
  surveillance:
    build: 
      context: .
      dockerfile: surveillance/Dockerfile
    container_name: cenca_surveillance
    environment:
      - NODE_ENV=production
      - MONITORING_API_URL=${MONITORING_API_URL}
      - MONITORING_USERNAME=${MONITORING_USERNAME:-ttoto}
      - MONITORING_PASSWORD=${MONITORING_PASSWORD:-password}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - MONITORING_INTERVAL=${MONITORING_INTERVAL:-300000}
      - MONITORING_TIMEOUT=${MONITORING_TIMEOUT:-15000}
    depends_on:
      - node_app
    networks:
      - monitoring
    restart: unless-stopped
    volumes:
      - ./routes:/app/routes:ro
      - ./surveillance/routes-config.json:/app/surveillance/routes-config.json
      - ./.env:/app/.env:ro

  # Serveur MCP lecture seule pour Claude (voir mcp/README.md).
  # Volontairement HORS du réseau "monitoring" : network_mode host l'exclut de tout réseau du compose,
  # il ne voit pas node_app/prometheus/surveillance et eux ne le voient pas.
  # Il écoute directement sur MCP_HOST:MCP_PORT (mcp/.env, 127.0.0.1 par défaut) et ALLOWED_IPS voit
  # les vraies adresses clientes. Pas de "ports:" : Docker ne peut pas l'exposer en contournant le pare-feu.
  # Propre .env (rôle PostgreSQL dédié), propre pool : ne partage rien avec le backend.
  mcp_sites:
    build: ./mcp
    image: cenca-mcp-sites:latest
    container_name: cenca_mcp_sites
    network_mode: host
    env_file: ./mcp/.env
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  monitoring:
    driver: bridge
    # Sous-réseau figé : node_app joint le MCP (mcp_sites, réseau hôte) depuis cette plage,
    # qui doit figurer dans ALLOWED_IPS de mcp/.env. Valeur identique à celle attribuée
    # jusqu'ici par Docker, donc rien à recréer.
    ipam:
      config:
        - subnet: 172.22.0.0/16
